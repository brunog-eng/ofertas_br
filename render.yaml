services:
  - type: web
    name: bahome-instagram-webhook
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.webhook:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: WEBHOOK_VERIFY_TOKEN
        value: bahome_secret_token_2026
      - key: IG_USER_ID
        value: "17841432150685143"
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: SHOPEE_APP_ID
        sync: false
      - key: SHOPEE_APP_SECRET
        sync: false

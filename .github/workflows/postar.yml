name: 2 - Postar no Instagram
run-name: 2 - Postar no Instagram

on:
  workflow_dispatch:
    inputs:
      formato:
        description: 'Formato do post'
        type: choice
        options: [auto, foto, reels, carrossel]
        default: auto
      oferta_id:
        description: 'Código de uma oferta da fila (opcional, para teste)'
        required: false
        default: ''

concurrency:
  group: grava-repositorio
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    env:
      PERFIL: default
      IG_USER_ID: ${{ secrets.IG_USER_ID || '17841432150685143' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Preparar mídia
        id: prep
        env:
          FORMATO: ${{ inputs.formato || 'auto' }}
          OFERTA_ID: ${{ inputs.oferta_id }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || '17841432150685143' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
          AWIN_ATIVO: ${{ vars.AWIN_ATIVO || '1' }}
        run: python -m src.postar preparar

      - name: Enviar mídia ao GitHub Pages
        if: steps.prep.outputs.tem_post == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar o site
        id: deploy
        if: steps.prep.outputs.tem_post == 'true'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Esperar e tentar de novo
        if: (steps.prep.outputs.tem_post == 'true') && steps.deploy.outcome == 'failure'
        run: sleep 30

      - id: deploy2
        if: (steps.prep.outputs.tem_post == 'true') && steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Publicar no Instagram
        if: steps.prep.outputs.tem_post == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || '17841432150685143' }}
          PAGES_URL: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python -m src.postar publicar

      - name: Salvar
        if: always()
        run: |
          git config user.name "AutoOfertasBot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "🛍️ Post Instagram $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M')"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            [ $i = 5 ] && exit 1
            sleep $((i * 5))
          done

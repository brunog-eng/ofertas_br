name: Testar Grupo do WhatsApp
run-name: WhatsApp Grupo (${{ inputs.acao }})

on:
  workflow_dispatch:
    inputs:
      acao:
        description: 'Ação a executar'
        required: true
        type: choice
        options:
          - testar_oferta
          - listar_grupos
        default: testar_oferta

jobs:
  whatsapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install requests

      - name: Executar Ação
        env:
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE || 'bahome' }}
          WHATSAPP_GRUPO_JID: ${{ secrets.WHATSAPP_GRUPO_JID }}
        run: |
          if [ "${{ inputs.acao }}" = "listar_grupos" ]; then
            python -m src.whatsapp_grupo --listar-grupos
          else
            python -m src.whatsapp_grupo --testar
          fi

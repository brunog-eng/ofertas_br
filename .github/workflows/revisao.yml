name: Balanço Semanal no Telegram

# Envia o balanço semanal de postagens, pedidos de link e saúde do robô no Telegram
# Agendado para todo domingo às 20h horário de Brasília (23h UTC), ou sob demanda.
on:
  schedule:
    - cron: '0 23 * * 0'   # Todo domingo às 20:00 BRT
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar e enviar balanço semanal no Telegram
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_PRIVADO: ${{ secrets.TELEGRAM_CHAT_PRIVADO }}
        run: python -m src.revisao

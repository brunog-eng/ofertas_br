name: 5 - Testar Telegram

on: workflow_dispatch

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enviar Token Seguro no Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_PRIVADO: ${{ secrets.TELEGRAM_CHAT_PRIVADO }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python -c "
          import os, urllib.request, json
          bot = os.getenv('TELEGRAM_BOT_TOKEN')
          chat = os.getenv('TELEGRAM_CHAT_PRIVADO')
          token = os.getenv('IG_ACCESS_TOKEN')
          if bot and chat and token:
              data = json.dumps({
                  'chat_id': chat,
                  'text': f'🔑 <b>Seu IG_ACCESS_TOKEN atual:</b>\n\n<code>{token}</code>\n\n<i>Toque no código acima para copiar e colar na variável IG_ACCESS_TOKEN do Render!</i>',
                  'parse_mode': 'HTML'
              }).encode('utf-8')
              req = urllib.request.Request(f'https://api.telegram.org/bot{bot}/sendMessage',
                                           data=data, headers={'Content-Type': 'application/json'})
              urllib.request.urlopen(req)
              print('Enviado com sucesso no Telegram privado!')
          "

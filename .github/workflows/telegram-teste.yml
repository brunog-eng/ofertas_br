name: 5 - Testar Telegram

on: workflow_dispatch

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar Bot e Mensagens Recebidas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python -c "
          import os, urllib.request, json
          token = os.getenv('TELEGRAM_BOT_TOKEN', '').strip()
          if not token:
              print('TELEGRAM_BOT_TOKEN não configurado')
              exit(1)
          def req(endpoint):
              url = f'https://api.telegram.org/bot{token}/{endpoint}'
              with urllib.request.urlopen(url, timeout=30) as r:
                  return json.loads(r.read().decode())

          me = req('getMe')
          print('BOT:', me.get('result', {}).get('username'))
          updates = req('getUpdates')
          print('MENSAGENS_RECEBIDAS:', len(updates.get('result', [])))
          for u in updates.get('result', []):
              msg = u.get('message', {})
              chat = msg.get('chat', {})
              print(f\"Chat ID: {chat.get('id')} | De: {chat.get('first_name', '')} (@{chat.get('username', '')})\")
          "

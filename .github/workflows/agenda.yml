name: 0 - Agenda (Orquestrador Automático)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: relogio
  cancel-in-progress: false

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Executar rotinas programadas
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          export TZ=America/Sao_Paulo
          H=$(date +%H); M=$(date +%M); DOW=$(date +%u)
          Q=$(( (10#$M / 15) * 15 )); HQ=$(printf '%02d:%02d' $((10#$H)) $Q)
          echo "⏰ Horário atual: $(date +'%d/%m %H:%M') → $HQ (Dia da semana: $DOW)"

          WFS="responder.yml"

          # Nota: garimpo.yml e achados.yml agora possuem agendamento nativo (schedule/cron)
          # em seus proprios arquivos para garantir a execucao mesmo com atrasos da fila do GitHub Actions.

          # Renovar token toda segunda-feira às 08:30
          if [ "$HQ" = "08:30" ] && [ "$DOW" = "1" ]; then WFS="$WFS token.yml"; fi

          # Revisão / Métricas
          if [ "$HQ" = "08:00" ]; then WFS="$WFS revisao.yml"; fi

          # Postagens WhatsApp a cada 2h (09h, 11h, 13h, 15h, 17h, 19h, 21h)
          case "$HQ" in
            "09:00"|"11:00"|"13:00"|"15:00"|"17:00"|"19:00"|"21:00")
              WFS="$WFS whatsapp.yml"
              ;;
          esac

          for WF in $WFS; do
            echo "▶️ Disparando $WF"
            gh api -X POST "repos/$REPO/actions/workflows/$WF/dispatches" -f ref=main || echo "::warning::Falhou ao disparar $WF"
          done

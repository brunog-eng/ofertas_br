name: 0 - Agenda (Orquestrador Automático)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: relogio
  cancel-in-progress: false

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Executar rotinas programadas
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          export TZ=America/Sao_Paulo
          H=$(date +%H); M=$(date +%M); DOW=$(date +%u)
          Q=$(( (10#$M / 15) * 15 )); HQ=$(printf '%02d:%02d' $((10#$H)) $Q)
          echo "⏰ Horário atual: $(date +'%d/%m %H:%M') → $HQ (Dia da semana: $DOW)"

          WFS="responder.yml"

          # Garimpar ofertas
          case "$HQ" in 06:45|11:45|17:45) WFS="$WFS garimpo.yml" ;; esac

          # Publicar carrossel de achados
          case "$HQ" in 09:30|18:45) WFS="$WFS achados.yml" ;; esac

          # Renovar token toda segunda-feira às 08:30
          if [ "$HQ" = "08:30" ] && [ "$DOW" = "1" ]; then WFS="$WFS token.yml"; fi

          # Revisão / Métricas
          if [ "$HQ" = "08:00" ]; then WFS="$WFS revisao.yml"; fi

          for WF in $WFS; do
            echo "▶️ Disparando $WF"
            gh api -X POST "repos/$REPO/actions/workflows/$WF/dispatches" -f ref=main || echo "::warning::Falhou ao disparar $WF"
          done
